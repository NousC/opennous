server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Proxy API, auth, the install-script endpoint and /v2 (the Events page reads GET /v2/events,
    # GET-947) to the backend. /install must be
    # same-origin on self-host so the "curl <this-host>/install | sh" command resolves.
    location ~ ^/(api|me|install|v2)(/|$) {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — serve a real file if it exists, else the app shell. The shell
    # goes through a named location so we can force no-store on it: otherwise the
    # browser heuristically caches index.html and keeps loading the OLD JS bundle
    # after a deploy (which is why a shipped fix can look like it "didn't work").
    location / {
        try_files $uri @index;
    }
    location @index {
        add_header Cache-Control "no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files /index.html =404;
    }
}

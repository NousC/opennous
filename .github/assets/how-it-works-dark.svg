<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="486" viewBox="0 0 1200 486" role="img" aria-label="How OpenNous works: your tools become observations, identity resolution turns them into one context graph of entities, claims and signals, served to agents and people over MCP and REST"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6F6A60"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F06A4C"/></marker></defs><rect x="24" y="24" width="196" height="46" rx="10" fill="#1A1917" stroke="#34312C" stroke-width="1.2"/><text x="42" y="53" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#F2F0EA" text-anchor="start" letter-spacing="0">CRM</text><rect x="24" y="88" width="196" height="46" rx="10" fill="#1A1917" stroke="#34312C" stroke-width="1.2"/><text x="42" y="117" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#F2F0EA" text-anchor="start" letter-spacing="0">Email and calendar</text><rect x="24" y="152" width="196" height="46" rx="10" fill="#1A1917" stroke="#34312C" stroke-width="1.2"/><text x="42" y="181" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#F2F0EA" text-anchor="start" letter-spacing="0">Calls and meetings</text><rect x="24" y="216" width="196" height="46" rx="10" fill="#1A1917" stroke="#34312C" stroke-width="1.2"/><text x="42" y="245" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#F2F0EA" text-anchor="start" letter-spacing="0">Outbound</text><rect x="24" y="280" width="196" height="46" rx="10" fill="#1A1917" stroke="#34312C" stroke-width="1.2"/><text x="42" y="309" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#F2F0EA" text-anchor="start" letter-spacing="0">LinkedIn</text><rect x="24" y="344" width="196" height="46" rx="10" fill="#1A1917" stroke="#34312C" stroke-width="1.2"/><text x="42" y="373" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#F2F0EA" text-anchor="start" letter-spacing="0">Product activity</text><path d="M220 47.0 C 244 47.0, 244 226.0, 260 226.0" fill="none" stroke="#34312C" stroke-width="1.4"/><path d="M220 111.0 C 244 111.0, 244 226.0, 260 226.0" fill="none" stroke="#34312C" stroke-width="1.4"/><path d="M220 175.0 C 244 175.0, 244 226.0, 260 226.0" fill="none" stroke="#34312C" stroke-width="1.4"/><path d="M220 239.0 C 244 239.0, 244 226.0, 260 226.0" fill="none" stroke="#34312C" stroke-width="1.4"/><path d="M220 303.0 C 244 303.0, 244 226.0, 260 226.0" fill="none" stroke="#34312C" stroke-width="1.4"/><path d="M220 367.0 C 244 367.0, 244 226.0, 260 226.0" fill="none" stroke="#34312C" stroke-width="1.4"/><path d="M248 226.0 L260 226.0" stroke="#6F6A60" stroke-width="1.4" marker-end="url(#arr)"/><rect x="262" y="128" width="182" height="196" rx="14" fill="#1A1917" stroke="#34312C" stroke-width="1.2"/><text x="282" y="168" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#F2F0EA" text-anchor="start" letter-spacing="-0.3">Observations</text><text x="282" y="202" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#C9C5BB" text-anchor="start" letter-spacing="0">Append-only evidence:</text><text x="282" y="226" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#C9C5BB" text-anchor="start" letter-spacing="0">every email, meeting,</text><text x="282" y="250" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#C9C5BB" text-anchor="start" letter-spacing="0">field change and event,</text><text x="282" y="274" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#C9C5BB" text-anchor="start" letter-spacing="0">with its source and time.</text><path d="M444 226.0 L516 226.0" stroke="#F06A4C" stroke-width="1.8" marker-end="url(#arrA)"/><text x="482.0" y="196.0" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#F06A4C" text-anchor="middle" letter-spacing="0">resolve</text><text x="482.0" y="213.0" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#F06A4C" text-anchor="middle" letter-spacing="0">identity</text><rect x="520" y="18" width="312" height="396" rx="18" fill="#151412" stroke="#6F6A60" stroke-width="1.2"/><rect x="538" y="38" width="276" height="100" rx="12" fill="#1A1917" stroke="#34312C" stroke-width="1.2"/><text x="560" y="71" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#F2F0EA" text-anchor="start" letter-spacing="-0.2">Entities</text><text x="560" y="98" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#C9C5BB" text-anchor="start" letter-spacing="0">One record per person,</text><text x="560" y="119" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#C9C5BB" text-anchor="start" letter-spacing="0">company and deal.</text><rect x="538" y="152" width="276" height="100" rx="12" fill="#1A1917" stroke="#34312C" stroke-width="1.2"/><text x="560" y="185" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#F2F0EA" text-anchor="start" letter-spacing="-0.2">Claims</text><text x="560" y="212" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#C9C5BB" text-anchor="start" letter-spacing="0">Current facts with source,</text><text x="560" y="233" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#C9C5BB" text-anchor="start" letter-spacing="0">confidence, freshness, validity.</text><rect x="538" y="266" width="276" height="100" rx="12" fill="#1A1917" stroke="#34312C" stroke-width="1.2"/><text x="560" y="299" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#F2F0EA" text-anchor="start" letter-spacing="-0.2">Signals</text><text x="560" y="326" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#C9C5BB" text-anchor="start" letter-spacing="0">Pain, objections, buying,</text><text x="560" y="347" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#C9C5BB" text-anchor="start" letter-spacing="0">risk and expansion, per account.</text><text x="676.0" y="400" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#9A958A" text-anchor="middle" letter-spacing="0">Permissions on every read</text><path d="M832 226.0 L870 226.0" stroke="#6F6A60" stroke-width="1.6" marker-end="url(#arr)"/><rect x="874" y="99.0" width="140" height="70" rx="12" fill="#1A1917" stroke="#34312C" stroke-width="1.2"/><text x="892" y="129.0" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F2F0EA" text-anchor="start" letter-spacing="0">MCP</text><text x="892" y="151.0" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#9A958A" text-anchor="start" letter-spacing="0">get_context</text><path d="M852 226.0 C 862 226.0, 862 134.0, 872 134.0" fill="none" stroke="#34312C" stroke-width="1.4"/><rect x="874" y="191.0" width="140" height="70" rx="12" fill="#1A1917" stroke="#34312C" stroke-width="1.2"/><text x="892" y="221.0" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F2F0EA" text-anchor="start" letter-spacing="0">REST API</text><text x="892" y="243.0" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#9A958A" text-anchor="start" letter-spacing="0">/v2</text><rect x="874" y="283.0" width="140" height="70" rx="12" fill="#1A1917" stroke="#34312C" stroke-width="1.2"/><text x="892" y="313.0" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F2F0EA" text-anchor="start" letter-spacing="0">App</text><text x="892" y="335.0" font-family="'Geist Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#9A958A" text-anchor="start" letter-spacing="0">accounts, graph</text><path d="M852 226.0 C 862 226.0, 862 318.0, 872 318.0" fill="none" stroke="#34312C" stroke-width="1.4"/><path d="M1014 226.0 C 1034 226.0, 1032 174.0, 1048 174.0" fill="none" stroke="#6F6A60" stroke-width="1.5" marker-end="url(#arr)"/><rect x="1052" y="134.0" width="124" height="80" rx="12" fill="#1A1917" stroke="#34312C" stroke-width="1.2"/><text x="1114.0" y="180.0" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F2F0EA" text-anchor="middle" letter-spacing="0">Agents</text><path d="M1014 226.0 C 1034 226.0, 1032 278.0, 1048 278.0" fill="none" stroke="#6F6A60" stroke-width="1.5" marker-end="url(#arr)"/><rect x="1052" y="238.0" width="124" height="80" rx="12" fill="#1A1917" stroke="#34312C" stroke-width="1.2"/><text x="1114.0" y="284.0" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F2F0EA" text-anchor="middle" letter-spacing="0">Your team</text><path d="M1114.0 318.0 L1114.0 460 L353.0 460 L353.0 328" fill="none" stroke="#6F6A60" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arr)"/><text x="737.0" y="450" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9A958A" text-anchor="middle" letter-spacing="0">replies, meetings and closed deals come back as new observations</text></svg>
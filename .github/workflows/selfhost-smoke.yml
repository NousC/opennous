name: Self-host smoke

# Walks the README quickstart on a fresh machine and checks the stack really works (GET-753):
#   stack     Linux (amd64): the bundled stack built from the public edition, then
#             scripts/selfhost-smoke.mjs (owner sign-up, closed sign-ups, demo seed, API key,
#             /v2/context, MCP, teammate join, cloud_only answers, api -> worker wiring).
#   platform  Windows, macOS and Linux: what an operator runs on their own machine before
#             Docker takes over. The checkout keeps the container scripts LF, the keys script
#             writes nous.env, update.sh's secret step runs, and Compose reads the files.
# GitHub's macOS and Windows runners cannot run Linux containers, so the full stack runs on
# Linux only; arm64 is covered by the multi-arch base images (checked on Apple Silicon).
# In the private repo the stack is built from the public edition (scripts/export-preview.mjs),
# because a checkout with the cloud/ folders is a Cloud build, not a self-hosted one.

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'supabase/**'
      - 'deploy/selfhost/**'
      - 'docker-compose*.yaml'
      - 'Caddyfile'
      - 'nous.env.example'
      - 'update.sh'
      - '.gitattributes'
      - 'scripts/selfhost-keys.mjs'
      - 'scripts/selfhost-smoke.mjs'
      - '.github/workflows/selfhost-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/selfhost/**'
      - 'docker-compose*.yaml'
      - 'scripts/selfhost-keys.mjs'
      - 'update.sh'
  workflow_dispatch:

jobs:
  stack:
    if: ${{ !startsWith(github.head_ref, 'public-pr/') && !startsWith(github.ref_name, 'public-pr/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Public edition
        id: tree
        run: |
          if [ -f scripts/export-preview.mjs ]; then
            node scripts/export-preview.mjs --out "$RUNNER_TEMP/public"
            echo "dir=$RUNNER_TEMP/public" >> "$GITHUB_OUTPUT"
          else
            echo "dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          fi

      - name: nous.env, as the README says
        working-directory: ${{ steps.tree.outputs.dir }}
        run: |
          cp nous.env.example nous.env
          sed -i -e 's/^APP_DOMAIN=.*/APP_DOMAIN=localhost/' \
                 -e 's/^API_DOMAIN=.*/API_DOMAIN=api.localhost/' \
                 -e 's/^MCP_DOMAIN=.*/MCP_DOMAIN=mcp.localhost/' \
                 -e 's/^ANTHROPIC_API_KEY=.*/ANTHROPIC_API_KEY=sk-ant-ci-placeholder/' nous.env
          node scripts/selfhost-keys.mjs nous.env
          grep -q '^127.0.0.1 api.localhost' /etc/hosts || echo '127.0.0.1 api.localhost mcp.localhost' | sudo tee -a /etc/hosts

      - name: docker compose up --build
        working-directory: ${{ steps.tree.outputs.dir }}
        run: docker compose --env-file nous.env up -d --build

      - name: Wait for the stack
        working-directory: ${{ steps.tree.outputs.dir }}
        run: |
          for i in $(seq 1 90); do
            curl -skf https://localhost/api/auth/config >/dev/null && curl -skf https://api.localhost/health >/dev/null && exit 0
            sleep 4
          done
          docker compose --env-file nous.env ps -a
          exit 1

      - name: Smoke test (with Caddy's CA, as docs/self-host-bundled.md says)
        working-directory: ${{ steps.tree.outputs.dir }}
        run: |
          docker compose --env-file nous.env cp caddy:/data/caddy/pki/authorities/local/root.crt caddy-root.crt
          NODE_EXTRA_CA_CERTS="$PWD/caddy-root.crt" node scripts/selfhost-smoke.mjs nous.env

      - name: Logs on failure
        if: failure()
        working-directory: ${{ steps.tree.outputs.dir }}
        run: docker compose --env-file nous.env logs --tail=200

  platform:
    if: ${{ !startsWith(github.head_ref, 'public-pr/') && !startsWith(github.ref_name, 'public-pr/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Default checkout settings on purpose: Windows runners check out with core.autocrlf=true,
      # like Git for Windows on an operator's machine. .gitattributes must win.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Container scripts are LF after checkout
        shell: bash
        run: |
          bad=0
          for f in deploy/selfhost/db/*.sh apps/frontend/docker/*.sh update.sh Caddyfile deploy/selfhost/Caddyfile nous.env.example; do
            if grep -q $'\r' "$f"; then echo "CRLF in $f"; bad=1; fi
          done
          exit $bad

      - name: Keys script writes nous.env (native shell)
        run: |
          node -e "const fs=require('fs');let t=fs.readFileSync('nous.env.example','utf8');t=t.replace(/^APP_DOMAIN=.*$/m,'APP_DOMAIN=localhost').replace(/^API_DOMAIN=.*$/m,'API_DOMAIN=api.localhost').replace(/^MCP_DOMAIN=.*$/m,'MCP_DOMAIN=mcp.localhost');fs.writeFileSync('nous.env',t)"
          node scripts/selfhost-keys.mjs nous.env
          node -e "const t=require('fs').readFileSync('nous.env','utf8');for(const k of ['POSTGRES_PASSWORD','SUPABASE_JWT_SECRET','SUPABASE_ANON_KEY','ENCRYPTION_KEY','WORKER_SECRET','SELFHOST_SETUP_TOKEN']){if(!new RegExp('^'+k+'=.+','m').test(t)){console.error('missing '+k);process.exit(1)}}if(t.includes('\r')){console.error('CRLF in nous.env');process.exit(1)}console.log('nous.env ok')"

      - name: Keys script tests
        run: node --test apps/api/tests/selfhostKeys.test.mjs

      - name: update.sh parses and its WORKER_SECRET step runs (bash; Git Bash on Windows)
        shell: bash
        run: |
          bash -n update.sh
          sed -i.bak '/^WORKER_SECRET=/d' nous.env && rm -f nous.env.bak
          awk '/^# Installs set up before WORKER_SECRET/,/^fi$/' update.sh > ws-step.sh
          bash ws-step.sh && bash ws-step.sh
          test "$(grep -cE '^WORKER_SECRET=[0-9a-f]{64}$' nous.env)" = 1

      - name: Compose reads the files with this nous.env
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if ! docker compose version >/dev/null 2>&1; then echo "no docker compose on this runner"; exit 0; fi
          docker compose --env-file nous.env config --quiet

      - name: '*.localhost resolves for Node (the CLI talks to https://api.localhost)'
        run: node -e "require('dns').lookup('api.localhost',(e,a)=>{console.log('api.localhost ->',e?e.code:a);process.exit(e?1:0)})"
